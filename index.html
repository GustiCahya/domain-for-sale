<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sales Inquery || PropertyFollow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Mukta+Mahee:300,700"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
      emailjs.init("mL_LPxCgXaLzGzPRK");
    </script>
  </head>
  <body>
    <section class="bg-alt hero p-0">
      <div class="container-fluid">
        <div class="row">
          <div class="col-sm-6 bg-faded text-center col-fixed">
            <div class="vMiddle">
              <h1 class="pt-4 h2">
                <span class="text-green">PropertyFollow.com</span>
                <small>available for sale</small>
              </h1>
              <p class="mt-4">For instantly purchase. Please make an order.</p>
              <div class="pt-5">
                <label for="name">
                  <a class="btn text-white bg-green btn-lg" href="#" target="_blank"
                    >Buy now for $1888</a
                  >
                </label>
              </div>
              <div
                class="row d-md-flex text-center justify-content-center text-primary action-icons"
              >
                <div class="col-sm-4">
                  <p><em class="ion-ios-chatbubble-outline icon-md"></em></p>
                  <p class="lead">
                    <a href="mailto:propertyfollow.ai@gmail.com"
                      >propertyfollow.ai@gmail.com</a
                    >
                  </p>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 offset-sm-6">
            <section class="bg-alt">
              <div class="container">
                <div class="row height-100">
                  <div class="col-sm-10 offset-sm-1 mt-2">
                    <form id="main-offer-form" method="post">
                      <h2 class="text-primary">Interested in this domain?</h2>
                      <hr />
                      <div class="form-group">
                        <input
                          type="text"
                          name="name"
                          id="name"
                          class="form-control"
                          placeholder="Full name (Required)"
                        />
                      </div>
                      <div class="row">
                        <div class="col">
                          <div class="form-group">
                            <input
                              type="email"
                              name="email"
                              id="email"
                              class="form-control"
                              placeholder="Email (Required)"
                            />
                          </div>
                        </div>
                        <div class="col">
                          <div class="form-group">
                            <input
                              type="text"
                              name="phone"
                              id="phone"
                              class="form-control"
                              placeholder="Phone number (Required)"
                            />
                          </div>
                        </div>
                      </div>
                      <div class="form-group">
                        <input
                          type="number"
                          name="price"
                          id="price"
                          class="form-control"
                          min="0"
                          placeholder="Offer price in USD? (Required)"
                        />
                      </div>
                      <div class="form-group">
                        <textarea
                          name="comments"
                          id="comments"
                          class="form-control"
                          placeholder="Message (optional)"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        id="submit-btn"
                        class="btn text-white btn-lg bg-primary btn-block"
                      >
                        Make an offer
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </section>
    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.validate.min.js"></script>

    <!-- Toast notification -->
    <div id="toast"></div>

    <script>
      function showToast(message, type) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = type;
        toast.style.display = "block";
        setTimeout(() => {
          toast.style.display = "none";
        }, 5000);
      }

      function validateForm() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const price = document.getElementById("price").value.trim();
        const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!name) {
          showToast("Please enter your full name.", "error");
          return false;
        }
        if (!email) {
          showToast("Please enter your email address.", "error");
          return false;
        }
        if (!emailRe.test(email)) {
          showToast("Please enter a valid email address.", "error");
          return false;
        }
        if (!phone) {
          showToast("Please enter your phone number.", "error");
          return false;
        }
        if (!price) {
          showToast("Please enter your offer price.", "error");
          return false;
        }
        return true;
      }

      document
        .getElementById("main-offer-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          if (!validateForm()) return;

          const btn = document.getElementById("submit-btn");
          btn.classList.add("loading");
          btn.disabled = true;

          const templateParams = {
            from_name: document.getElementById("name").value.trim(),
            from_email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            offer_price: document.getElementById("price").value.trim(),
            message:
              document.getElementById("comments").value.trim() ||
              "(no message)",
            to_email: "propertyfollow.ai@gmail.com",
          };

          // ✅ Replace 'YOUR_SERVICE_ID' and 'YOUR_TEMPLATE_ID' with your actual EmailJS IDs
          emailjs
            .send("service_xuzth0o", "template_xeigy8h", templateParams)
            .then(function () {
              showToast(
                "✅ Your offer was sent successfully! We'll be in touch soon.",
                "success"
              );
              document.getElementById("main-offer-form").reset();
            })
            .catch(function (error) {
              console.error("EmailJS error:", error);
              showToast(
                "❌ Failed to send. Please try again or email us directly.",
                "error"
              );
            })
            .finally(function () {
              btn.classList.remove("loading");
              btn.disabled = false;
            });
        });
    </script>
  </body>
</html>
